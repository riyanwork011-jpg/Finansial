<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker Tabungan Utama</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #0b0b0b;
      --line: #292929;
      --muted: #a1a1aa;
      --green: #00d26a;
      --blue: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      background: radial-gradient(circle at top, #151515 0, var(--bg) 55%);
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap { width: min(720px, 100%); margin: 0 auto; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 18px 50px #0008;
    }
    h1 { font-size: 18px; margin: 0 0 16px; font-weight: 700; }
    .topline { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
    .amount { color: var(--green); font-size: clamp(27px, 6vw, 36px); font-weight: 700; letter-spacing: .3px; }
    .count { color: #d4d4d8; font-size: 13px; white-space: nowrap; padding-bottom: 5px; }
    .bar { height: 10px; margin: 13px 0 22px; background: #292929; border-radius: 999px; overflow: hidden; }
    .bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00a94f, #00e676); border-radius: inherit; transition: width .25s ease; }
    .months { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px 18px; }
    label.month { display: flex; align-items: center; gap: 9px; font-size: 14px; cursor: pointer; color: #f4f4f5; }
    input[type="checkbox"] {
      appearance: none; width: 17px; height: 17px; margin: 0; flex: 0 0 17px;
      border: 1px solid #777; border-radius: 50%; background: transparent; cursor: pointer;
      display: grid; place-items: center;
    }
    input[type="checkbox"]:checked { background: var(--green); border-color: var(--green); }
    input[type="checkbox"]:checked::after { content: "✓"; color: #03150b; font-size: 12px; font-weight: 800; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    button {
      border: 1px solid #3a3a3a; background: #101010; color: #e5e5e5;
      padding: 11px 16px; border-radius: 999px; cursor: pointer; font-weight: 600;
      transition: background .2s, border-color .2s;
    }
    button:hover { background: #1b1b1b; border-color: #666; }
    .reset { width: 100%; }
    .settings { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .settings label { display: block; color: #d4d4d8; font-size: 13px; margin-bottom: 8px; }
    .setting-row { display: flex; gap: 10px; align-items: center; }
    input[type="number"] {
      width: 100%; min-width: 0; padding: 11px 12px; border-radius: 9px;
      border: 1px solid #3a3a3a; background: #050505; color: white; font-size: 14px;
    }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 16px 0 0; }
    .saved { color: var(--green); min-height: 16px; font-size: 12px; margin-top: 10px; }
    @media (max-width: 520px) {
      .card { padding: 17px; }
      .months { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 10px; }
      .month { font-size: 13px !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Tracker Tabungan Utama</h1>
      <div class="topline">
        <div class="amount" id="total">Rp0</div>
        <div class="count" id="count">0/12 bulan</div>
      </div>
      <div class="bar" aria-label="Progress tabungan">
        <div class="bar-fill" id="progress"></div>
      </div>

      <div class="months" id="months"></div>

      <div class="actions">
        <button class="reset" id="reset">Reset tracker</button>
      </div>

      <div class="settings">
        <label for="monthlyAmount">Target tabungan setiap bulan (Rp)</label>
        <div class="setting-row">
          <input id="monthlyAmount" type="number" min="0" step="5000" value="175000">
          <button id="saveAmount">Simpan</button>
        </div>
        <div class="saved" id="savedMessage" aria-live="polite"></div>
      </div>

      <p class="hint">
        Centang bulan setelah kamu benar-benar menyisihkan uang. Data tersimpan otomatis di browser/perangkat ini.
        Jika membuka website dari browser atau perangkat lain, datanya tidak otomatis ikut berpindah.
      </p>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "trackerTabunganUtama_v1";
    const monthsContainer = document.getElementById("months");
    const totalElement = document.getElementById("total");
    const countElement = document.getElementById("count");
    const progressElement = document.getElementById("progress");
    const amountInput = document.getElementById("monthlyAmount");
    const savedMessage = document.getElementById("savedMessage");

    const monthNames = [
      "Bulan 1", "Bulan 2", "Bulan 3", "Bulan 4",
      "Bulan 5", "Bulan 6", "Bulan 7", "Bulan 8",
      "Bulan 9", "Bulan 10", "Bulan 11", "Bulan 12"
    ];

    let state = {
      checked: Array(12).fill(false),
      monthlyAmount: 175000
    };

    function loadState() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return;
      try {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed.checked) && parsed.checked.length === 12) {
          state.checked = parsed.checked.map(Boolean);
        }
        if (Number.isFinite(parsed.monthlyAmount) && parsed.monthlyAmount >= 0) {
          state.monthlyAmount = parsed.monthlyAmount;
        }
      } catch (error) {
        console.warn("Data tracker tidak bisa dibaca; memakai pengaturan awal.", error);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function rupiah(value) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency", currency: "IDR", maximumFractionDigits: 0
      }).format(value);
    }

    function renderMonths() {
      monthsContainer.innerHTML = "";
      monthNames.forEach((name, index) => {
        const label = document.createElement("label");
        label.className = "month";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = state.checked[index];
        checkbox.setAttribute("aria-label", name);

        checkbox.addEventListener("change", () => {
          state.checked[index] = checkbox.checked;
          saveState();
          updateSummary();
        });

        const text = document.createElement("span");
        text.textContent = name;

        label.append(checkbox, text);
        monthsContainer.appendChild(label);
      });
    }

    function updateSummary() {
      const completed = state.checked.filter(Boolean).length;
      const total = completed * state.monthlyAmount;
      const percentage = (completed / 12) * 100;

      totalElement.textContent = rupiah(total);
      countElement.textContent = `${completed}/12 bulan`;
      progressElement.style.width = `${percentage}%`;
      progressElement.parentElement.setAttribute(
        "aria-valuenow", String(Math.round(percentage))
      );
    }

    document.getElementById("saveAmount").addEventListener("click", () => {
      const value = Number(amountInput.value);
      if (!Number.isFinite(value) || value < 0) {
        savedMessage.textContent = "Masukkan nominal Rp0 atau lebih.";
        return;
      }
      state.monthlyAmount = Math.floor(value);
      saveState();
      updateSummary();
      savedMessage.textContent = "Nominal bulanan berhasil disimpan.";
    });

    document.getElementById("reset").addEventListener("click", () => {
      const confirmed = confirm("Yakin ingin menghapus semua centang bulan? Nominal bulanan tidak akan berubah.");
      if (!confirmed) return;
      state.checked = Array(12).fill(false);
      saveState();
      renderMonths();
      updateSummary();
      savedMessage.textContent = "Tracker berhasil di-reset.";
    });

    loadState();
    amountInput.value = state.monthlyAmount;
    renderMonths();
    updateSummary();
  </script>
</body>
</html>
